refresh_seconds: 60
retain_hours: 48              # keep identified assets on screen this long
timezone: Asia/Kuwait            # display time zone
impulse:                         # PRIMARY TRIGGER — sudden move + volume on 5m candles
  min_move_pct: 0.8              # over the last 1 or 2 candles (reduced: easier to catch moves)
  candles: 2
  vol_multiple: 2.5              # candle volume ÷ avg per-candle volume (reduced for sensitivity)
  avg_lookback_days: 3           # range 2–4
  cold_start_assets: 50          # kept for the app's local (non-cron) mode
  always_check_top_volume: 50    # collector: inspect candles of the 50 most liquid perps every cycle
  always_check_24h_pct: 5        # collector: and of anything already ±5% on the day, ledger or not
  catch_up_candles: 12           # collector: test every window ending in the last 60 min — a move that fired while
                                 #   the job was restarting is still journaled, stamped with its true time + late_min
daily_movers:                    # SECONDARY TRIGGER — catch 24h big movers (like SAND)
  enabled: true                  # GitHub collects these; app decides what to show
  move_pct: 15                   # capture moves ≥15% over 24h (user can filter in app)
crypto:
  enabled: true
  heavy_move_pct: 30
  funding_high_pct: 0.10         # 8h-equivalent
  funding_extreme_pct: 0.40
  dont_touch: {move_pct: 50, float_pct: 30, funding_pct: -0.30}
stocks:
  enabled: true
  finviz_cap: midunder           # nano→mid on the screener; nano removed below
  min_market_cap_usd: 50000000   # micro (≥$50M) through mid cap
  min_day_change_pct: 2          # pre-filter before checking 5m impulse
  max_candidates: 40
macd: {fast: 12, slow: 26, signal: 9, cross_lookback: 3}
timeframes: ["5m", "30m", "1h"]
weights: {move: 1.0, rvol: 1.5, extension: 1.0, funding: 1.0, liquidation: 1.0}
